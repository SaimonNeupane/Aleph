services:
  frontend:
    build: ./frontend
    ports:
      - 5173
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
  backend:
    build: ./backend
    ports:
      - 8000:8000
    volumes:
      - ./backend:/usr/src/app
  nginx:
    image: nginx
    depends_on:
      - backend
      - frontend
    ports:
      - 8080:80
    volumes:
      - ./nginx/dev.conf:/etc/nginx/nginx.conf:ro
    

 

